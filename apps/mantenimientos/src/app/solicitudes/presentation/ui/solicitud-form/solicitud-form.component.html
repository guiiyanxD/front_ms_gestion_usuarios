<form class="form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <h2 class="form__title">Nueva solicitud de mantenimiento</h2>
  <div class="form__grid">

    <div class="field field--full asset-search">
      <span class="field__label">Activo fijo <span aria-hidden="true">*</span></span>
      <input
        class="field__input"
        type="text"
        placeholder="Buscar por código o nombre…"
        aria-label="Buscar activo fijo"
        [value]="assetSearch()"
        (input)="onAssetInput($any($event.target).value)"
        (focus)="showAssetDropdown.set(true)"
        (blur)="onAssetBlur()"
      />
      @if (showAssetDropdown() && filteredAssets().length > 0) {
        <ul class="asset-search__dropdown" role="listbox">
          @for (a of filteredAssets(); track a.id) {
            <li class="asset-search__option" role="option" (mousedown)="selectAsset(a)">
              <span class="asset-search__codigo">{{ a.codigo }}</span> — {{ a.name }}
            </li>
          }
        </ul>
      }
      @if (form.controls.fixedAssetId.touched && form.controls.fixedAssetId.invalid) {
        <span class="field__error" role="alert">Obligatorio.</span>
      }
    </div>

    <label class="field">
      <span class="field__label">Tipo <span aria-hidden="true">*</span></span>
      <select class="field__input" formControlName="tipo" aria-label="Tipo de mantenimiento">
        @for (t of tipos; track t) {
          <option [value]="t">{{ tipoLabels[t] }}</option>
        }
      </select>
    </label>

    <label class="field">
      <span class="field__label">Prioridad <span aria-hidden="true">*</span></span>
      <select class="field__input" formControlName="prioridad" aria-label="Prioridad">
        @for (p of prioridades; track p) {
          <option [value]="p">{{ prioridadLabels[p] }}</option>
        }
      </select>
    </label>

    <label class="field field--full">
      <span class="field__label">Área <span aria-hidden="true">*</span></span>
      <select class="field__input" formControlName="areaId" aria-label="Área">
        <option [value]="null">— Selecciona un área —</option>
        @for (a of areas(); track a.id) {
          <option [value]="a.id">{{ a.nombre }}</option>
        }
      </select>
      @if (form.controls.areaId.touched && form.controls.areaId.invalid) {
        <span class="field__error" role="alert">Obligatorio.</span>
      }
    </label>

    <label class="field field--full">
      <span class="field__label">Descripción <span aria-hidden="true">*</span></span>
      <textarea class="field__input field__textarea" formControlName="description" rows="3" aria-label="Descripción"></textarea>
      @if (form.controls.description.touched && form.controls.description.invalid) {
        <span class="field__error" role="alert">Obligatorio.</span>
      }
    </label>

  </div>
  <div class="form__actions">
    <button class="btn btn--ghost" type="button" (click)="cancelled.emit()">Cancelar</button>
    <button class="btn" type="submit" [disabled]="saving()">{{ saving() ? 'Guardando…' : 'Crear solicitud' }}</button>
  </div>
</form>
