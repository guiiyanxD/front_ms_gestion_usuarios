<table class="tbl">
  <thead>
    <tr>
      <th class="tbl__th">Nombre</th>
      <th class="tbl__th">Usuario</th>
      <th class="tbl__th">Email</th>
      <th class="tbl__th">Rol</th>
      <th class="tbl__th tbl__th--actions">Acciones</th>
    </tr>
  </thead>
  <tbody>
    @for (user of users(); track user.id) {
      <tr class="tbl__row">
        <td class="tbl__td">{{ user.firstName }} {{ user.lastName }}</td>
        <td class="tbl__td">{{ user.username }}</td>
        <td class="tbl__td">{{ user.email }}</td>
        <td class="tbl__td"><span class="chip">{{ user.roleName }}</span></td>
        <td class="tbl__td tbl__td--actions">
          <button class="btn-sm" type="button" (click)="edit.emit(user)">Editar</button>
          <button class="btn-sm btn-sm--danger" type="button" (click)="remove.emit(user)">Eliminar</button>
        </td>
      </tr>
    } @empty {
      <tr><td class="tbl__td tbl__empty" colspan="5">No hay usuarios registrados.</td></tr>
    }
  </tbody>
</table>
