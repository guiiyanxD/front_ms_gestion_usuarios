<main class="profile">
  @if (status() === 'loading') {
    <p class="profile__msg">Cargando perfil…</p>
  } @else if (status() === 'error') {
    <p class="profile__msg profile__msg--error" role="alert">{{ error() }}</p>
  } @else if (profile(); as p) {
    <app-profile-card [profile]="p" />
  }
</main>
