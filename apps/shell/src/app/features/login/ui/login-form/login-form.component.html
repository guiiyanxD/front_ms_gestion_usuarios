<!-- features/login/ui/login-form/login-form.component.html -->
<form class="form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <label class="field">
    <span class="field__label">Correo electrónico</span>
    <input
      class="field__input"
      type="email"
      formControlName="email"
      autocomplete="email"
      [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
    />
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <span class="field__error" role="alert">Ingresa un correo electrónico válido.</span>
    }
  </label>

  <label class="field">
    <span class="field__label">Contraseña</span>
    <input
      class="field__input"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
    />
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <span class="field__error" role="alert">Mínimo 3 caracteres.</span>
    }
  </label>

  @if (errorMessage()) {
    <p class="form__alert" role="alert">{{ errorMessage() }}</p>
  }

  <button class="btn" type="submit" [disabled]="loading()">
    {{ loading() ? 'Ingresando…' : 'Iniciar sesión' }}
  </button>
</form>
