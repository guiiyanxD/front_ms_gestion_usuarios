<form class="form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <h2 class="form__title">{{ editing() ? 'Editar activo' : 'Nuevo activo fijo' }}</h2>

  <div class="form__grid">
    <label class="field">
      <span class="field__label">Nombre <span aria-hidden="true">*</span></span>
      <input class="field__input" type="text" formControlName="name" aria-label="Nombre del activo" />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <span class="field__error" role="alert">Obligatorio.</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Categoría <span aria-hidden="true">*</span></span>
      <select class="field__input" formControlName="category" aria-label="Categoría del activo">
        @for (c of categories; track c) {
          <option [value]="c">{{ categoryLabels[c] }}</option>
        }
      </select>
    </label>

    <label class="field">
      <span class="field__label">Estado <span aria-hidden="true">*</span></span>
      <select class="field__input" formControlName="status" aria-label="Estado del activo">
        @for (s of statuses; track s) {
          <option [value]="s">{{ statusLabels[s] }}</option>
        }
      </select>
    </label>

    <label class="field">
      <span class="field__label">Ubicación <span aria-hidden="true">*</span></span>
      <input class="field__input" type="text" formControlName="location" aria-label="Ubicación del activo" />
      @if (form.controls.location.touched && form.controls.location.invalid) {
        <span class="field__error" role="alert">Obligatorio.</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Fecha de adquisición <span aria-hidden="true">*</span></span>
      <input class="field__input" type="date" formControlName="acquisitionDate" aria-label="Fecha de adquisición" />
      @if (form.controls.acquisitionDate.touched && form.controls.acquisitionDate.invalid) {
        <span class="field__error" role="alert">Obligatorio.</span>
      }
    </label>

    <label class="field">
      <span class="field__label">URL de imagen</span>
      <input class="field__input" type="url" formControlName="imageUrl" placeholder="https://..." aria-label="URL de imagen" />
    </label>

    @if (!editing()) {
      <label class="field">
        <span class="field__label">Usuario (opcional)</span>
        <select class="field__input" formControlName="userId" aria-label="Usuario a asignar">
          <option value="">— Sin asignar —</option>
          @for (u of userOptions(); track u.id) {
            <option [value]="u.id">{{ u.firstName }} {{ u.lastName }} — {{ u.email }}</option>
          }
        </select>
      </label>

      <label class="field">
        <span class="field__label">Marca</span>
        <input class="field__input" type="text" formControlName="marca" aria-label="Marca del activo" />
      </label>

      <label class="field">
        <span class="field__label">Modelo</span>
        <input class="field__input" type="text" formControlName="modelo" aria-label="Modelo del activo" />
      </label>

      <label class="field">
        <span class="field__label">Valor de adquisición</span>
        <input class="field__input" type="number" min="0" formControlName="valorAdquisicion" aria-label="Valor de adquisición del activo" />
      </label>
    }

    <label class="field field--full">
      <span class="field__label">Descripción</span>
      <textarea class="field__input field__textarea" formControlName="description" rows="3" aria-label="Descripción"></textarea>
    </label>
  </div>

  <div class="form__actions">
    <button class="btn btn--ghost" type="button" (click)="cancelled.emit()">Cancelar</button>
    <button class="btn" type="submit" [disabled]="saving()">
      {{ saving() ? 'Guardando…' : 'Guardar' }}
    </button>
  </div>
</form>
