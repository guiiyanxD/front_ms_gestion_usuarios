<table class="tbl">
  <thead>
    <tr>
      <th class="tbl__th">Nombre</th>
      <th class="tbl__th">Categoría</th>
      <th class="tbl__th">Estado</th>
      <th class="tbl__th">Ubicación</th>
      <th class="tbl__th tbl__th--actions">Ver</th>
      <th class="tbl__th tbl__th--actions">Editar</th>
      <th class="tbl__th tbl__th--actions">Eliminar</th>
    </tr>
  </thead>
  <tbody>
    @for (activo of activos(); track activo.id) {
      <tr class="tbl__row">
        <td class="tbl__td">{{ activo.name }}</td>
        <td class="tbl__td">{{ categoryLabel(activo.category) }}</td>
        <td class="tbl__td">
          <span class="chip chip--{{ activo.status }}">{{ statusLabel(activo.status) }}</span>
        </td>
        <td class="tbl__td">{{ activo.location }}</td>
        <td class="tbl__td tbl__td--actions">
          <button class="btn-sm" type="button" (click)="view.emit(activo)">Ver</button>
        </td>
        <td class="tbl__td tbl__td--actions">
          <button class="btn-sm" type="button" (click)="edit.emit(activo)">Editar</button>
        </td>
        <td class="tbl__td tbl__td--actions">
          <button class="btn-sm btn-sm--danger" type="button" (click)="remove.emit(activo)">Eliminar</button>
        </td>
      </tr>
    } @empty {
      <tr><td class="tbl__td tbl__empty" colspan="7">No hay activos registrados.</td></tr>
    }
  </tbody>
</table>
