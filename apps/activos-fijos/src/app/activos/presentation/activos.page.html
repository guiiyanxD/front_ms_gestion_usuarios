<main class="activos">
  <header class="activos__head">
    <h1 class="activos__title">Gestión de Activos Fijos</h1>
    @if (!showForm()) {
      <button class="btn" type="button" (click)="onNew()">Nuevo activo</button>
    }
  </header>

  @if (status() === 'error') {
    <p class="activos__alert" role="alert">{{ error() }}</p>
  }

  @if (showForm()) {
    <app-activo-form
      [editing]="editingActivo()"
      [saving]="isSaving()"
      (submitted)="onSubmit($event)"
      (cancelled)="onCancel()"
    />
  } @else if (status() === 'loading') {
    <p class="activos__msg">Cargando activos…</p>
  } @else {
    <app-activo-table
      [activos]="activos()"
      (view)="onView($event)"
      (edit)="onEdit($event)"
      (remove)="onDelete($event)"
    />

    @if (totalPages() > 1) {
      <div class="activos__pagination">
        <button class="btn btn--ghost" type="button" [disabled]="!hasPrevious()" (click)="onPrevPage()">
          ← Anterior
        </button>
        <span class="activos__page-info">
          Página {{ currentPage() }} de {{ totalPages() }} — {{ totalElements() }} activos
        </span>
        <button class="btn btn--ghost" type="button" [disabled]="!hasNext()" (click)="onNextPage()">
          Siguiente →
        </button>
      </div>
    }
  }
</main>
