<article class="card">
  <div class="card__icon" aria-hidden="true">📄</div>
  <div class="card__body">
    <h3 class="card__title">{{ reporte().label }}</h3>
    <p class="card__desc">{{ reporte().descripcion }}</p>
  </div>
  <div class="card__actions">
    <button
      class="btn btn--excel"
      type="button"
      [disabled]="anyDownloading()"
      (click)="onDownload('excel')"
    >
      @if (isDownloadingExcel()) { Descargando… } @else { Excel }
    </button>
    <button
      class="btn btn--pdf"
      type="button"
      [disabled]="anyDownloading()"
      (click)="onDownload('pdf')"
    >
      @if (isDownloadingPdf()) { Descargando… } @else { PDF }
    </button>
  </div>
</article>
